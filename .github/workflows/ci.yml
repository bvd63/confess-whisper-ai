name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      VITE_SUPABASE_URL:
        required: false
        description: Supabase project URL
      VITE_SUPABASE_PUBLISHABLE_KEY:
        required: false
        description: Supabase public API key

env:
  NODE_VERSION: '20'

jobs:
  build-test-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint & Auto-Fix
        run: npm run lint -- --fix || true

      - name: ENV Validation
        run: npm run check:env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Unit Tests
        run: npm run test:unit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Integration Tests
        run: npm run test:integration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: E2E Tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Coverage Report
        run: npm run coverage
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build (production)
        run: npm run build

      - name: Admin Bundle Guard
        run: npm run guard:admin-chunk
        env:
          ADMIN_CHUNK_LIMIT_KB: 500

      - name: Bundle Size Report
        run: npm run analyze || true

      - name: Save reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage
            dist

      - name: Lighthouse Performance (mobile)
        run: npx lhci autorun --collect.settings.preset=mobile || true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-test-analyze
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.confessai.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: dist/
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment"
          # Add your staging deployment commands here
      - name: Health check
        run: |
          sleep 30
          curl -f https://staging.confessai.app/api/health || exit 1

  deploy-canary:
    name: Deploy Canary (10%)
    runs-on: ubuntu-latest
    needs: build-test-analyze
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-canary
      url: https://confessai.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: dist/
      - name: Deploy canary
        run: |
          echo "Deploying canary (10% traffic)"
          # Add canary deployment commands
      - name: Health check
        run: |
          sleep 30
          curl -f https://confessai.app/api/health || exit 1
      - name: Monitor metrics
        run: |
          sleep 300  # Monitor for 5 minutes
          # Add metrics validation

  deploy-production:
    name: Deploy to Production (100%)
    runs-on: ubuntu-latest
    needs: deploy-canary
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://confessai.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: dist/
      - name: Deploy to production
        run: |
          echo "Deploying to production (100% traffic)"
          # Add production deployment commands
      - name: Final health check
        run: |
          sleep 30
          curl -f https://confessai.app/api/health || exit 1
          curl -f https://confessai.app/api/metrics || exit 1

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-canary, deploy-production]
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back deployment"
          # Add rollback commands here
